name: Test and build Windows EXE
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install, test, and package
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Check EXE starts without Python
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'musicplayer-self-test.json'
          $process = Start-Process ./dist/MusicPlayer.exe -ArgumentList '--self-test', $report -PassThru
          if (!$process.WaitForExit(60000)) { Stop-Process $process; throw 'Packaged app test timed out' }
          if ($process.ExitCode -ne 0) { Get-Content $report; throw 'Packaged app test failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (!$result.ok) { throw 'Packaged app report failed' }
          Get-Content $report
      - uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-Windows-x64
          path: release/MusicPlayer-Windows-x64.zip
          if-no-files-found: error
